[package]
name = "shrip-disk-usage"
version = "0.0.1"
authors = ["Rikusu Shado"]
edition = "2024"
description = "Check disk usage of a server and notify about high usage using a message bot"

[[bin]]
name = "disk_usage"
path = "./src/main.rs"

[profile.release]
strip = true
opt-level = "s"
lto = "fat"

[dependencies]
shellexpand = "3.1.0"
rukky_types = { path = "../../utils/rukky_types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
